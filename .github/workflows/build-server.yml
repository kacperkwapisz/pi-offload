name: build-server

# Builds the pi-offload-server Docker image and publishes it to GHCR.
#
# - push to main (server changes): publishes `latest` + `sha-<short>`
# - push of v* tag:                publishes full semver fan-out (v1.2.3, 1.2, 1)
# - pull_request:                  builds only (no push) to validate the Dockerfile
# - workflow_dispatch:             manual trigger
#
# Published images target linux/amd64 (the native arch of GitHub-hosted
# ubuntu-latest runners), signed with cosign keyless (Sigstore OIDC), and
# shipped with SLSA build provenance + an SBOM attestation.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "server/**"
      - ".github/workflows/build-server.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/build-server.yml"
  workflow_dispatch:

# Cancel superseded runs on the same ref. Tag pushes get their own group so
# release builds are never killed mid-flight.
concurrency:
  group: build-server-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pi-offload-server
  # Pin the cosign version we install. Update deliberately.
  COSIGN_VERSION: v2.4.1

jobs:
  build:
    name: build & push
    runs-on: ubuntu-latest

    permissions:
      contents: read            # checkout
      packages: write           # push to ghcr.io
      id-token: write           # cosign keyless OIDC + buildx provenance
      attestations: write       # write provenance/SBOM attestations to the registry

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so buildx can read git metadata for the provenance attestation.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Skip the login step on PRs from forks — they don't have access to the
      # GITHUB_TOKEN's `packages: write` scope, and we don't push from forks
      # anyway. For same-repo PRs the login still runs but the push step is
      # gated below.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tags applied:
          #   - branch name (only the default branch is "latest" — see below)
          #   - pr-N for pull requests
          #   - semver fan-out on v* tags: v1.2.3, 1.2, 1
          #   - sha-<short> on every push for immutable references
          #   - latest only on default branch
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=pi-offload-server
            org.opencontainers.image.description=HTTP server that runs offloaded pi coding-agent sessions
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reusable layer cache scoped to this workflow.
          cache-from: type=gha,scope=build-server
          cache-to: type=gha,mode=max,scope=build-server
          # SLSA build provenance (mode=max embeds full build environment info).
          provenance: mode=max
          # In-toto SBOM attestation generated by buildx (uses syft under the hood).
          sbom: true

      # ----- Sign published images (push events only) -----------------------
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign image digest (keyless, Sigstore OIDC)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          # cosign signs the image by digest, not by tag — this means every tag
          # pointing at this digest is covered by a single signature.
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            ref="${tag%%:*}@${DIGEST}"
            echo "Signing $ref"
            cosign sign --yes "$ref"
          done <<< "$TAGS"

      # ----- Job summary ----------------------------------------------------
      - name: Write job summary
        if: always()
        run: |
          {
            echo "### pi-offload-server build"
            echo ""
            echo "| | |"
            echo "|-|-|"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Ref | \`${{ github.ref }}\` |"
            echo "| Pushed | \`${{ github.event_name != 'pull_request' }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Platform | \`linux/amd64\` |"
            echo ""
            echo "**Tags:**"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo ""
              echo "**Verify the signature:**"
              echo ""
              echo '```bash'
              echo "cosign verify \\"
              echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.github/workflows/build-server.yml@.*' \\"
              echo "  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\"
              echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
